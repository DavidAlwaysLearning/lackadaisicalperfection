<style>
  :root {
    --navy: #1c1410;
    --ink: #f4ead6;
    --mute: #c4b089;
    --glow: #e0b24a;
    --line: rgba(224,178,74,0.28);
    --field: rgba(244,234,214,0.06);
    --field-border: rgba(224,178,74,0.35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #5a3a28 0%, #1c1410 55%, #0e0a08 100%);
    color: var(--ink);
    font-family: "Source Sans 3", sans-serif;
    font-weight: 300;
    line-height: 1.65;
    min-height: 100vh;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  .eyebrow {
    text-align: center;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--glow);
    margin: 0 0 10px;
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: clamp(1.75rem, 5vw, 2.15rem);
    text-align: center;
    margin: 0 0 12px;
    letter-spacing: 0.01em;
  }
  .lede {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.15rem;
    text-align: center;
    color: var(--mute);
    margin: 0 0 28px;
  }
  .rule {
    border: 0;
    border-top: 1px solid var(--line);
    width: 64px;
    margin: 0 auto 28px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  label {
    display: block;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--mute);
    margin-bottom: 6px;
  }
  input[type="email"],
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--field-border);
    border-radius: 4px;
    background: var(--field);
    color: var(--ink);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 400;
    outline: none;
  }
  input[type="email"]:focus,
  input[type="text"]:focus {
    border-color: var(--glow);
    box-shadow: 0 0 0 2px rgba(224,178,74,0.18);
  }
  input::placeholder { color: rgba(196,176,137,0.55); }
  .hp {
    position: absolute;
    left: -5000px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
  button[type="submit"] {
    margin-top: 8px;
    padding: 13px 18px;
    border: 1px solid var(--glow);
    border-radius: 4px;
    background: transparent;
    color: var(--glow);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  button[type="submit"]:hover {
    background: var(--glow);
    color: var(--navy);
  }
  button[type="submit"]:disabled,
  button[type="submit"]:disabled:hover {
    background: transparent;
    color: var(--glow);
    opacity: 0.55;
    cursor: progress;
  }
  .form-error {
    margin: 2px 0 0;
    text-align: center;
    font-size: 0.9rem;
    color: var(--mute);
  }
  .thanks {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.25rem;
    text-align: center;
    color: var(--ink);
    margin: 8px 0 0;
  }
  .fine {
    margin-top: 22px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--mute);
  }
  .fine a {
    color: var(--ink);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  footer {
    text-align: center;
    color: var(--mute);
    font-size: 0.85rem;
    margin-top: 48px;
  }
</style>

<body>
<a class="skip-link" href="#content">Skip to content</a>
<main id="content">
  <p class="eyebrow">Melodic Subtlety</p>
  <h1>Subscribe</h1>
  <p class="lede">Occasional Notes</p>
  <hr class="rule">

  <div data-fan-signup-root>
    <form method="post" action="#subscribe" id="fan-signup" data-fan-signup novalidate>
      <div>
        <label for="EMAIL">Email</label>
        <input type="email" name="email" id="EMAIL" required autocomplete="email" maxlength="254" placeholder="you@example.com">
      </div>

      <div>
        <label for="FNAME">First name <span style="text-transform:none;letter-spacing:0;opacity:.7">(optional)</span></label>
        <input type="text" name="firstName" id="FNAME" autocomplete="given-name" maxlength="80">
      </div>

      <!-- Honeypot. People never see this. Bots that fill it are ignored. -->
      <div class="hp" aria-hidden="true">
        <label for="company_fax">Company fax</label>
        <input type="text" name="company_fax" id="company_fax" tabindex="-1" autocomplete="off" value="">
      </div>

      <button type="submit">Subscribe</button>
      <p class="form-error" data-fan-error role="alert" hidden></p>
    </form>
    <p class="thanks" data-fan-thanks role="status" hidden></p>
  </div>

  <p class="fine"><a href="https://lackadaisicalperfection.com/">Back to Lackadaisical Perfection</a></p>
  <footer>Subtlety Media · ASCAP</footer>
</main>
