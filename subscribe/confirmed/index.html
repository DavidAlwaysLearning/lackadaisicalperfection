<style>
  :root {
    --navy: #1c1410;
    --ink: #f4ead6;
    --mute: #c4b089;
    --glow: #e0b24a;
    --line: rgba(224,178,74,0.28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #5a3a28 0%, #1c1410 55%, #0e0a08 100%);
    color: var(--ink);
    font-family: "Source Sans 3", sans-serif;
    font-weight: 300;
    line-height: 1.65;
    min-height: 100vh;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  .eyebrow {
    text-align: center;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--glow);
    margin: 0 0 10px;
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 400;
    font-size: clamp(1.75rem, 5vw, 2.15rem);
    text-align: center;
    margin: 0 0 12px;
    letter-spacing: 0.01em;
  }
  .lede {
    font-family: "Cormorant Garamond", serif;
    font-size: 1.15rem;
    text-align: center;
    color: var(--mute);
    margin: 0 0 28px;
  }
  .rule {
    border: 0;
    border-top: 1px solid var(--line);
    width: 64px;
    margin: 0 auto 28px;
  }
  .cta {
    display: block;
    text-align: center;
    margin-top: 8px;
    padding: 13px 18px;
    border: 1px solid var(--glow);
    border-radius: 4px;
    background: transparent;
    color: var(--glow);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .cta:hover,
  .cta:focus-visible {
    background: var(--glow);
    color: var(--navy);
    outline: none;
  }
  .fine {
    margin-top: 22px;
    text-align: center;
    font-size: 0.82rem;
    color: var(--mute);
  }
  .fine a {
    color: var(--mute);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .fine a:hover,
  .fine a:focus-visible {
    color: var(--ink);
  }
  footer {
    text-align: center;
    color: var(--mute);
    font-size: 0.85rem;
    margin-top: 48px;
  }
</style>
