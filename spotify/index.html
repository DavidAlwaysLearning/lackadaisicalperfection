<script>
/* Phones: site-nav.js strips target="_blank" on music links before this runs,
   so the tap stays in this tab. Leaving the page can cancel the pixel, so
   wait for fbq's eventCallback, with a short timeout if the pixel never answers.
   Desktop keeps the new tab: the pixel is sent first, then the tab opens
   in this same click. This page stays up, so the hit is not dropped.
   Inbound utm_* (and any other query) stays on this page. Store hrefs are
   absolute and are never rebuilt from location.search, so Apple's i and ls
   parameters cannot be broken by a second question mark. */
(function () {
  var WAIT_MS = 300;
  var buttons = document.querySelectorAll("a[data-tap]");

  function plainClick(event) {
    if (event.defaultPrevented) return false;
    if (event.button !== 0) return false;
    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return false;
    return true;
  }

  function openStore(href) {
    var opened = window.open(href, "_blank");
    if (opened) {
      try { opened.opener = null; } catch (err) {}
      return;
    }
    location.assign(href);
  }

  buttons.forEach(function (a) {
    a.addEventListener("click", function (event) {
      if (!plainClick(event)) return;
      if (typeof fbq !== "function") return;

      var name = a.getAttribute("data-tap");
      if (name !== "SpotifyTap" && name !== "AppleTap") return;

      var href = a.href;
      if (!href) return;

      var newTab = a.getAttribute("target") === "_blank";
      event.preventDefault();

      if (newTab) {
        try { fbq("trackCustom", name); } catch (err) {}
        openStore(href);
        return;
      }

      var left = false;
      function leave() {
        if (left) return;
        left = true;
        location.assign(href);
      }

      try {
        fbq("trackCustom", name, {}, { eventCallback: leave });
      } catch (err) {
        leave();
        return;
      }
      window.setTimeout(leave, WAIT_MS);
    });
  });
})();
</script>
